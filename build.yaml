# Personal fork: trimmed to the Sweep/cradio (nice!nano v2) only.
# See upstream build.yaml for the full list of supported keyboards:
# https://github.com/OneDeadKey/zmk-config-aekeynox/blob/main/build.yaml

include:

    # Sweep/cradio + nice!nano v2
    # ZMK Studio enabled on the central (left) half only.
  - board: nice_nano@2//zmk
    shield: cradio_left
    artifact-name: sweep_left
    snippet: studio-rpc-usb-uart
    cmake-args: -DCONFIG_ZMK_STUDIO=y -DCONFIG_ZMK_POINTING=y
  - board: nice_nano@2//zmk
    shield: cradio_right
    artifact-name: sweep_right

    # Bluetooth settings reset for nice!nano v2
    # https://zmk.dev/docs/troubleshooting/connection-issues
  - board: nice_nano@2//zmk
    shield: settings_reset
    artifact-name: nice_nano_v2_settings_reset
